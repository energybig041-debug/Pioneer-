<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 PIONEER 6.2 - VIDEO + CHAT - BY AZEEZ IYANDA MISILIU 🚀</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; }
       .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px 20px; text-align: center; }
        h1 { font-size: 60px; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.5); margin-bottom: 8px; }
       .tagline { font-size: 20px; font-weight: 700; text-transform: uppercase; }
       .ceo { font-size: 16px; font-weight: 800; margin-top: 12px; background: rgba(255,255,255,0.2); display: inline-block; padding: 6px 18px; border-radius: 20px; border: 2px solid white; }
       .container { max-width: 700px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) {.container { grid-template-columns: 2fr 1fr; } }
       .post-box,.chat-box { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 2px solid #667eea; }
       .box-title { font-weight: 800; color: #667eea; margin-bottom: 10px; font-size: 18px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; resize: none; font-size: 16px; font-family: inherit; outline: none; min-height: 60px; }
       .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 10px 25px; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; width: 100%; }
       .file-input { margin: 10px 0; }
       .feed { margin-top: 20px; }
       .post { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; border-left: 4px solid #667eea; }
       .post-author { font-weight: 800; margin-bottom: 8px; color: #667eea; }
       .post-time { font-size: 12px; color: #65676b; margin-bottom: 8px; }
        video { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 400px; }
       .chat-messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
       .chat-msg { margin-bottom: 8px; padding: 6px 10px; background: #e4e6eb; border-radius: 12px; display: inline-block; max-width: 80%; }
       .chat-msg.me { background: #667eea; color: white; float: right; clear: both; }
       .chat-input-row { display: flex; gap: 8px; }
       .chat-input-row input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 PIONEER 🚀</h1>
        <p class="tagline">THE NEW SOCIAL HOME</p>
        <p class="ceo">👑 BY AZEEZ IYANDA MISILIU 👑</p>
    </div>
    
    <div class="container">
        <div>
            <div class="post-box">
                <div class="box-title">📝 CREATE POST</div>
                <textarea id="postInput" placeholder="What's the vision, CEO Azeez?"></textarea>
                <input type="file" id="videoInput" accept="video/*" class="file-input">
                <button class="btn" onclick="createPost()">🔥 POST TO PIONEER 🔥</button>
            </div>
            
            <div class="feed" id="feed">
                <div class="post">
                    <div class="post-author">👑 Azeez Iyanda Misiliu - CEO & FOUNDER</div>
                    <div class="post-time">11:28 PM - April 28, 2026</div>
                    <div>WE LAUNCHED PIONEER TONIGHT!!! Video + Chat coming next!!! 🚀🌍💍❤️</div>
                </div>
            </div>
        </div>

        <div class="chat-box">
            <div class="box-title">💬 PIONEER CHAT</div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg">👑 Azeez: Welcome to Pioneer Chat!</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Message..." onkeypress="if(event.key==='Enter')sendChat()">
                <button class="btn" style="width:auto; padding:8px 15px;" onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <script>
        function createPost() {
            const input = document.getElementById('postInput');
            const videoInput = document.getElementById('videoInput');
            const feed = document.getElementById('feed');
            if (input.value.trim() === '' &&!videoInput.files[0]) return;
            
            const post = document.createElement('div');
            post.className = 'post';
            let content = `
                <div class="post-author">👑 Azeez Iyanda Misiliu</div>
                <div class="post-time">Just now</div>
                <div>${input.value}</div>
            `;
            
            if (videoInput.files[0]) {
                const videoURL = URL.createObjectURL(videoInput.files[0]);
                content += `<video controls src="${videoURL}"></video>`;
            }
            
            post.innerHTML = content;
            feed.prepend(post);
            input.value = '';
            videoInput.value = '';
        }
        
        function sendChat() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('chatMessages');
            if (input.value.trim() === '') return;
            
            const msg = document.createElement('div');
            msg.className = 'chat-msg me';
            msg.textContent = `👑 Azeez: ${input.value}`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
            input.value = '';
        }
    </script>
</body>
</html>
