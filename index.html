<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer 6.3 - By Azeez Iyanda Misiliu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #18191a; color: #e4e6eb; }
        .hidden { display: none !important; }
        
        /* LOGIN SCREEN */
        .login-page { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: #242526; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .login-title { font-size: 48px; font-weight: 900; text-align: center; margin-bottom: 10px; color: #667eea; }
        .login-tagline { text-align: center; margin-bottom: 30px; color: #b0b3b8; }
        .input { width: 100%; padding: 14px; margin-bottom: 12px; background: #3a3b3c; border: 1px solid #3e4042; border-radius: 8px; color: white; font-size: 16px; }
        .btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
        .btn-green { background: #42b72a; }
        .divider { height: 1px; background: #3e4042; margin: 20px 0; }
        .ceo-credit { text-align: center; margin-top: 20px; font-size: 14px; color: #b0b3b8; font-weight: 600; }
        
        /* MAIN APP */
        .header { background: #242526; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3e4042; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #667eea; }
        .header-icons { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; background: #3a3b3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
        
        /* MENU PAGE */
        .menu-page { padding: 16px; max-width: 600px; margin: 0 auto; }
        .profile-card { background: #242526; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; }
        .avatar { width: 40px; height: 40px; background: #667eea; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .menu-item { background: #242526; padding: 16px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .menu-icon { font-size: 28px; }
        .menu-text { font-size: 13px; font-weight: 600; text-align: center; }
        .logout-btn { background: #3a3b3c; color: #e41e3f; margin-top: 16px; }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-page">
        <div class="login-box">
            <div class="login-title">👑 PIONEER</div>
            <div class="login-tagline">The New Social Home</div>
            
            <div id="loginForm">
                <input type="text" id="loginName" class="input" placeholder="Full Name">
                <input type="password" id="loginPass" class="input" placeholder="Password">
                <button class="btn" onclick="login()">Log In</button>
                <div class="divider"></div>
                <button class="btn btn-green" onclick="showSignup()">Create New Account</button>
            </div>
            
            <div id="signupForm" class="hidden">
                <input type="text" id="signupName" class="input" placeholder="Full Name">
                <input type="password" id="signupPass" class="input" placeholder="New Password">
                <button class="btn btn-green" onclick="signup()">Sign Up</button>
                <button class="btn" style="background:#3a3b3c;" onclick="showLogin()">Back to Login</button>
            </div>
            
            <div class="ceo-credit">👑 By Azeez Iyanda Misiliu 👑</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="hidden">
        <div class="header">
            <div class="logo">👑 PIONEER</div>
            <div class="header-icons">
                <div class="icon-btn" onclick="showMenu()">☰</div>
                <div class="icon-btn" onclick="logout()">↪️</div>
            </div>
        </div>
        
        <div id="menuPage" class="menu-page">
            <div class="profile-card" onclick="alert('Profile coming in Pioneer 6.4!')">
                <div class="avatar">👑</div>
                <div>
                    <div style="font-weight:700;" id="userName">Abdul Azeez</div>
                    <div style="font-size:13px; color:#b0b3b8;">View your profile</div>
                </div>
            </div>
            
            <div class="menu-grid">
                <div class="menu-item" onclick="alert('Memories coming soon!')">
                    <div class="menu-icon">🕐</div><div class="menu-text">Memories</div>
                </div>
                <div class="menu-item" onclick="alert('Dashboard coming soon!')">
                    <div class="menu-icon">📊</div><div class="menu-text">Dashboard</div>
                </div>
                <div class="menu-item" onclick="alert('Messages coming Pioneer 6.4!')">
                    <div class="menu-icon">💬</div><div class="menu-text">Messages</div>
                </div>
                <div class="menu-item" onclick="alert('Groups coming soon!')">
                    <div class="menu-icon">👥</div><div class="menu-text">Groups</div>
                </div>
                <div class="menu-item" onclick="alert('Friends coming soon!')">
                    <div class="menu-icon">👫</div><div class="menu-text">Friends</div>
                </div>
                <div class="menu-item" onclick="alert('Reels coming Pioneer 6.5!')">
                    <div class="menu-icon">🎬</div><div class="menu-text">Reels</div>
                </div>
                <div class="menu-item" onclick="alert('Marketplace coming soon!')">
                    <div class="menu-icon">🏪</div><div class="menu-text">Marketplace</div>
                </div>
                <div class="menu-item" onclick="alert('Pages coming soon!')">
                    <div class="menu-icon">🚩</div><div class="menu-text">Pages</div>
                </div>
                <div class="menu-item" onclick="alert('Saved coming soon!')">
                    <div class="menu-icon">🔖</div><div class="menu-text">Saved</div>
                </div>
                <div class="menu-item" onclick="alert('Birthdays coming soon!')">
                    <div class="menu-icon">🎁</div><div class="menu-text">Birthdays</div>
                </div>
                <div class="menu-item" onclick="alert('Events coming soon!')">
                    <div class="menu-icon">📅</div><div class="menu-text">Events</div>
                </div>
                <div class="menu-item" onclick="alert('Meta Verified coming soon!')">
                    <div class="menu-icon">✅</div><div class="menu-text">Meta Verified</div>
                </div>
            </div>
            
            <button class="btn logout-btn" onclick="logout()">Log Out</button>
        </div>
    </div>

    <script>
        // Check if logged in
        if(localStorage.getItem('pioneerUser')) {
            showApp();
        }
        
        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
        }
        
        function showLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
        
        function signup() {
            const name = document.getElementById('signupName').value;
            const pass = document.getElementById('signupPass').value;
            if(!name || !pass) return alert('Fill all fields!');
            
            localStorage.setItem('pioneerUser', name);
            localStorage.setItem('pioneerPass', pass);
            showApp();
        }
        
        function login() {
            const name = document.getElementById('loginName').value;
            const pass = document.getElementById('loginPass').value;
            const savedUser = localStorage.getItem('pioneerUser');
            const savedPass = localStorage.getItem('pioneerPass');
            
            if(name === savedUser && pass === savedPass) {
                showApp();
            } else if(!savedUser) {
                alert('No account found! Click Create New Account');
            } else {
                alert('Wrong name or password!');
            }
        }
        
        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userName').textContent = localStorage.getItem('pioneerUser');
        }
        
        function logout() {
            localStorage.removeItem('pioneerUser');
            location.reload();
        }
        
        function showMenu() {
            alert('You are in the Menu! 👑');
        }
    </script>
</body>
    </html>
