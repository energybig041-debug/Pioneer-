<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer 8.3 - By BIG ENERGY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #e4e6eb; }
      .hidden { display: none!important; }
       .fb-login-page { min-height: 100vh; background: #000; display: flex; flex-direction: column; padding: 20px; }
       .lang-selector { text-align: center; color: #b0b3b8; font-size: 14px; margin: 20px 0 40px; cursor: pointer; }
       .fb-logo { width: 60px; height: 60px; background: #667eea; border-radius: 50%; margin: 0 auto 40px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: white; }
       .login-form { max-width: 396px; margin: 0 auto; width: 100%; }
       .fb-input { width: 100%; padding: 18px 16px; background: #1c1e21; border: 1px solid #3a3b3c; border-radius: 6px; color: white; font-size: 17px; margin-bottom: 12px; }
       .fb-btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: 700; cursor: pointer; margin: 16px 0; }
       .fb-btn:disabled { background: #3a3b3c; cursor: not-allowed; }
       .forgot-link { text-align: center; color: #667eea; font-size: 16px; cursor: pointer; margin: 16px 0; }
       .divider { height: 1px; background: #3a3b3c; margin: 24px 0; }
       .create-btn { width: 100%; max-width: 200px; padding: 14px; background: transparent; color: #667eea; border: 1px solid #667eea; border-radius: 6px; font-size: 17px; font-weight: 700; cursor: pointer; margin: 0 auto; display: block; }
       .meta-footer { text-align: center; margin-top: auto; padding: 20px 0; color: #8a8d91; font-size: 14px; }
       .otp-input { text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 700; }
       .error { color: #ff4444; font-size: 13px; margin: -8px 0 8px; }
       .success { color: #42b72a; font-size: 13px; margin: -8px 0 8px; }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="fb-login-page">
        <div class="lang-selector" onclick="showLanguages()">
            🌍 <span id="currentLang">English (US)</span> ▼
        </div>
        <div class="fb-logo">P</div>
        <div class="login-form">
            <input type="text" id="loginEmail" class="fb-input" placeholder="Mobile number or email address">
            <input type="password" id="loginPass" class="fb-input" placeholder="Password">
            <button class="fb-btn" onclick="login()">Log in</button>
            <div class="forgot-link" onclick="forgotPassword()">Forgotten password?</div>
            <div class="divider"></div>
            <button class="create-btn" onclick="showSignup()">Create new account</button>
        </div>
        <div class="meta-footer">∞ Pioneer by BIG ENERGY</div>
    </div>

    <!-- SIGNUP PAGE -->
    <div id="signupPage" class="fb-login-page hidden">
        <div class="fb-logo" style="margin-top: 60px;">P</div>
        <div class="login-form">
            <input type="text" id="firstName" class="fb-input" placeholder="First name">
            <input type="text" id="lastName" class="fb-input" placeholder="Last name">
            <input type="text" id="signupContact" class="fb-input" placeholder="Mobile number or email address">
            <div id="contactError" class="error hidden"></div>
            <input type="password" id="signupPass" class="fb-input" placeholder="New password">
            <button class="fb-btn" id="signupBtn" onclick="startSignup()">Sign Up</button>
            <div class="forgot-link" onclick="showLogin()">Already have an account?</div>
        </div>
    </div>

    <!-- OTP VERIFY PAGE -->
    <div id="otpPage" class="fb-login-page hidden">
        <div class="fb-logo" style="margin-top: 60px;">P</div>
        <div class="login-form">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Enter confirmation code</div>
                <div style="color: #b0b3b8; font-size: 15px;" id="otpSubtitle">We sent a 6-digit code to your email/phone</div>
            </div>
            <input type="text" id="otpCode" class="fb-input otp-input" placeholder="000000" maxlength="6">
            <div id="otpError" class="error hidden">Wrong code. Try again.</div>
            <button class="fb-btn" onclick="verifyOTP()">Confirm</button>
            <div class="forgot-link" onclick="resendOTP()">Didn't get a code? Resend</div>
            <div class="forgot-link" onclick="showSignup()">Back</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="hidden">
        <div style="background: #242526; padding: 12px; text-align: center;">
            <div style="font-size: 24px; font-weight: 900; color: #667eea;">pioneer</div>
            <div style="color: #b0b3b8; margin-top: 8px;">Welcome, <span id="welcomeName">BIG ENERGY</span>! ✅</div>
        </div>
    </div>

    <script>
        let generatedOTP = '';
        let signupData = {};
        let isEmail = false;

        function showLogin() {
            document.getElementById('signupPage').classList.add('hidden');
            document.getElementById('otpPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function showSignup() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('signupPage').classList.remove('hidden');
        }

        function startSignup() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const contact = document.getElementById('signupContact').value.trim();
            const pass = document.getElementById('signupPass').value;
            const errorDiv = document.getElementById('contactError');

            if(!firstName || !lastName || !contact || !pass) {
                errorDiv.textContent = 'Please fill all fields!';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Check if email or phone
            isEmail = contact.includes('@');
            const phoneRegex = /^[\+]?[0-9]{10,15}$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if(!isEmail && !phoneRegex.test(contact.replace(/\s/g, ''))) {
                errorDiv.textContent = 'Enter valid email or phone number';
                errorDiv.classList.remove('hidden');
                return;
            }

            if(isEmail && !emailRegex.test(contact)) {
                errorDiv.textContent = 'Enter valid email address';
                errorDiv.classList.remove('hidden');
                return;
            }

            errorDiv.classList.add('hidden');
            
            signupData = {
                name: firstName + ' ' + lastName,
                contact: contact,
                pass: pass,
                type: isEmail ? 'email' : 'phone'
            };

            // Generate OTP
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            
            // SHOW OTP PAGE
            document.getElementById('signupPage').classList.add('hidden');
            document.getElementById('otpPage').classList.remove('hidden');
            document.getElementById('otpSubtitle').textContent = `We sent a 6-digit code to ${contact}`;
            
            // IN PRODUCTION: Call your backend here to send real SMS/Email
            // For now: Show code (replace this with Firebase/Twilio)
            alert(`PIONEER VERIFICATION\n\nYour code is: ${generatedOTP}\n\nSent to: ${contact}\n\n(In production: This sends to real ${isEmail ? 'email' : 'SMS'})\n\n⚡ Enter code to continue`);
        }

        function verifyOTP() {
            const code = document.getElementById('otpCode').value;
            const errorDiv = document.getElementById('otpError');
            
            if(code === generatedOTP) {
                // Save user
                localStorage.setItem('pioneerUser', signupData.name);
                localStorage.setItem('pioneerContact', signupData.contact);
                localStorage.setItem('pioneerPass', signupData.pass);
                localStorage.setItem('pioneerVerified', 'true');
                localStorage.setItem('pioneerContactType', signupData.type);
                
                alert('✅ Account Verified!\n\nWelcome to Pioneer, ' + signupData.name + '!\n\nYour ' + signupData.type + ' is confirmed! ⚡');
                showApp();
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function resendOTP() {
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            alert(`New code sent: ${generatedOTP}\n\nTo: ${signupData.contact}\n\nEnter this code ⚡`);
            document.getElementById('otpError').classList.add('hidden');
        }

        function login() {
            const contact = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            if(!localStorage.getItem('pioneerUser')) {
                alert('No account found! Click "Create new account"');
                return;
            }
            
            if(contact === localStorage.getItem('pioneerContact')) {
                if(pass === localStorage.getItem('pioneerPass')) {
                    showApp();
                } else {
                    alert('Wrong password!');
                }
            } else {
                alert('Account not found! Sign up first.');
            }
        }

        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('signupPage').classList.add('hidden');
            document.getElementById('otpPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('welcomeName').textContent = localStorage.getItem('pioneerUser');
        }

        function showLanguages() {
            const langs = ['English (US)', 'English (UK)', 'Yoruba', 'Hausa', 'Igbo', 'French', 'Arabic', 'Spanish', 'Portuguese', 'Swahili'];
            const choice = prompt('Select Language:\n\n' + langs.map((l,i) => (i+1) + '. ' + l).join('\n'));
            if(choice) {
                const lang = langs[parseInt(choice)-1] || 'English (US)';
                document.getElementById('currentLang').textContent = lang;
            }
        }

        function forgotPassword() {
            alert('Forgot Password\n\nEnter your email/phone and we will send reset code!\n\nPioneer 9.0: Real email reset coming!');
        }

        // Check if logged in
        if(localStorage.getItem('pioneerUser')) {
            showApp();
        }
    </script>
</body>
    </html>
