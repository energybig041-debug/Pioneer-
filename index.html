<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer 7.4 - By BIG ENERGY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #18191a; color: #e4e6eb; }
      .hidden { display: none!important; }
       .login-page { min-height: 100vh; background: #18191a; display: flex; align-items: center; justify-content: center; padding: 20px; }
       .login-box { width: 100%; max-width: 400px; text-align: center; }
       .login-title { font-size: 52px; font-weight: 900; margin-bottom: 40px; color: #667eea; }
       .input { width: 100%; padding: 16px; margin-bottom: 12px; background: #3a3b3c; border: 1px solid #3e4042; border-radius: 8px; color: white; font-size: 16px; }
       .btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
       .btn-green { background: #42b72a; width: auto; padding: 14px 24px; margin: 20px auto; display: block; }
       .ceo-credit { margin-top: 40px; font-size: 14px; color: #b0b3b8; font-weight: 600; }
       .header { background: #242526; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3e4042; position: sticky; top: 0; z-index: 100; }
       .logo { font-size: 28px; font-weight: 900; color: #667eea; cursor: pointer; }
       .header-icons { display: flex; gap: 8px; }
       .icon-btn { width: 40px; height: 40px; background: #3a3b3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
       .feed { background: #18191a; }
       .post { background: #242526; margin-bottom: 8px; }
       .post-header { padding: 12px; display: flex; align-items: center; gap: 8px; }
       .avatar { width: 40px; height: 40px; background: #667eea; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
       .post-user { flex: 1; }
       .post-name { font-weight: 700; font-size: 15px; cursor: pointer; }
       .post-time { font-size: 13px; color: #b0b3b8; }
       .post-content { padding: 0 12px 12px; font-size: 15px; line-height: 1.4; }
       .post-buttons { display: flex; }
       .post-btn { flex: 1; padding: 8px; text-align: center; font-weight: 600; color: #b0b3b8; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-box">
            <div class="login-title">pioneer</div>
            <input type="text" id="loginName" class="input" placeholder="Email or phone number">
            <input type="password" id="loginPass" class="input" placeholder="Password">
            <button class="btn" onclick="login()">Log In</button>
            <button class="btn btn-green" onclick="showSignup()">Create new account</button>
            <div class="ceo-credit">⚡ By BIG ENERGY ⚡</div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="header">
            <div class="logo">pioneer</div>
        </div>
        <div class="feed">
            <div class="post">
                <div class="post-header">
                    <div class="avatar">⚡</div>
                    <div class="post-user">
                        <div class="post-name">BIG ENERGY ✅</div>
                        <div class="post-time">Just now</div>
                    </div>
                </div>
                <div class="post-content">PIONEER IS FIXED!!! ⚡ Welcome BIG ENERGY!!!</div>
                <div class="post-buttons">
                    <div class="post-btn">👍 Like</div>
                    <div class="post-btn">💬 Comment</div>
                    <div class="post-btn">↗️ Share</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if(localStorage.getItem('pioneerUser')) showApp();
        
        function showSignup() {
            const name = prompt('Full Name:');
            const pass = prompt('Password:');
            if(name && pass) {
                localStorage.setItem('pioneerUser', name);
                localStorage.setItem('pioneerPass', pass);
                alert('Welcome to Pioneer, ' + name + '! ⚡');
                showApp();
            }
        }
        
        function login() {
            const name = document.getElementById('loginName').value;
            const pass = document.getElementById('loginPass').value;
            if(!localStorage.getItem('pioneerUser')) {
                if(name && pass) {
                    localStorage.setItem('pioneerUser', name);
                    localStorage.setItem('pioneerPass', pass);
                    alert('Welcome to Pioneer, ' + name + '! ⚡ Account created!');
                    showApp();
                }
                return;
            }
            if(name === localStorage.getItem('pioneerUser')) {
                showApp();
            } else {
                alert('Wrong details! Your account name is: ' + localStorage.getItem('pioneerUser'));
            }
        }
        
        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        }
    </script>
</body>
        </html>
