<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer - By BIG ENERGY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #000; 
            color: #e4e6eb; 
        }
       .hidden { display: none!important; }
       
       /* FACEBOOK LOGIN PAGE */
       .fb-login-page { 
            min-height: 100vh; 
            background: #000; 
            display: flex; 
            flex-direction: column;
            padding: 20px; 
        }
       
       .lang-selector {
            text-align: center;
            color: #b0b3b8;
            font-size: 14px;
            margin: 20px 0 40px;
            cursor: pointer;
        }
        
       .fb-logo {
            width: 60px;
            height: 60px;
            background: #667eea;
            border-radius: 50%;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            color: white;
        }
        
       .login-form {
            max-width: 396px;
            margin: 0 auto;
            width: 100%;
        }
        
       .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        
       .fb-input { 
            width: 100%; 
            padding: 18px 16px; 
            background: #1c1e21; 
            border: 1px solid #3a3b3c; 
            border-radius: 6px; 
            color: white; 
            font-size: 17px; 
        }
        
       .fb-input:focus { 
            outline: none; 
            border-color: #667eea; 
        }
        
       .fb-input::placeholder {
            color: #8a8d91;
        }
        
       .info-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid #8a8d91;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #8a8d91;
            cursor: pointer;
        }
        
       .fb-btn { 
            width: 100%; 
            padding: 14px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 20px; 
            font-weight: 700; 
            cursor: pointer; 
            margin: 16px 0; 
        }
        
       .fb-btn:active {
            background: #5568d3;
        }
        
       .forgot-link { 
            text-align: center; 
            color: #667eea; 
            font-size: 16px; 
            cursor: pointer; 
            margin: 16px 0; 
        }
        
       .divider {
            height: 1px;
            background: #3a3b3c;
            margin: 24px 0;
        }
        
       .create-btn { 
            width: 100%;
            max-width: 200px;
            padding: 14px; 
            background: transparent; 
            color: #667eea; 
            border: 1px solid #667eea; 
            border-radius: 6px; 
            font-size: 17px; 
            font-weight: 700; 
            cursor: pointer; 
            margin: 0 auto;
            display: block;
        }
        
       .meta-footer {
            text-align: center;
            margin-top: auto;
            padding: 20px 0;
            color: #8a8d91;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
       .meta-logo {
            font-weight: 700;
        }
        
       .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            color: #e4e6eb;
            cursor: pointer;
        }

       /* MAIN APP */
       .header { background: #242526; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3e4042; }
       .logo { font-size: 28px; font-weight: 900; color: #667eea; }
       .feed { background: #18191a; padding: 12px; min-height: calc(100vh - 60px); }
       .post { background: #242526; margin-bottom: 8px; border-radius: 8px; padding: 12px; }
    </style>
</head>
<body>
    <!-- FACEBOOK STYLE LOGIN -->
    <div id="loginPage" class="fb-login-page">
        <div class="back-arrow" onclick="alert('Going back...')">←</div>
        
        <div class="lang-selector" onclick="showLanguages()">
            English (US) ▼
        </div>
        
        <div class="fb-logo">P</div>
        
        <div class="login-form">
            <div class="input-group">
                <input type="text" id="loginEmail" class="fb-input" placeholder="Mobile number or email">
                <div class="info-icon" onclick="alert('Enter your Pioneer email or phone number')">i</div>
            </div>
            
            <input type="password" id="loginPass" class="fb-input" placeholder="Password">
            
            <button class="fb-btn" onclick="login()">Log in</button>
            
            <div class="forgot-link" onclick="showForgot()">Forgot password?</div>
            
            <div class="divider"></div>
            
            <button class="create-btn" onclick="showSignup()">Create new account</button>
        </div>
        
        <div class="meta-footer">
            <span class="meta-logo">∞</span>
            <span>Pioneer by BIG ENERGY</span>
        </div>
    </div>

    <!-- SIGNUP PAGE - SAME AS BEFORE -->
    <div id="signupPage" class="fb-login-page hidden">
        <div class="back-arrow" onclick="showLogin()">←</div>
        <div class="fb-logo" style="margin-top: 60px;">P</div>
        <div class="login-form">
            <input type="text" id="firstName" class="fb-input" placeholder="First name" style="margin-bottom: 12px;">
            <input type="text" id="lastName" class="fb-input" placeholder="Last name" style="margin-bottom: 12px;">
            <input type="text" id="signupEmail" class="fb-input" placeholder="Mobile number or email" style="margin-bottom: 12px;">
            <input type="password" id="signupPass" class="fb-input" placeholder="New password" style="margin-bottom: 12px;">
            <button class="fb-btn" onclick="quickSignup()">Sign Up</button>
            <div class="forgot-link" onclick="showLogin()">Already have an account?</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="hidden">
        <div class="header">
            <div class="logo">pioneer</div>
            <div style="color: #b0b3b8; font-size: 14px;" id="userDisplay">BIG ENERGY ✅</div>
        </div>
        <div class="feed">
            <div class="post">
                <div style="font-weight: 700; margin-bottom: 8px;">Welcome to Pioneer, <span id="welcomeName">BIG ENERGY</span>! ⚡</div>
                <div style="color: #b0b3b8; font-size: 14px;">Your Facebook-style login is LIVE! Start posting!</div>
            </div>
        </div>
    </div>

    <script>
        if(localStorage.getItem('pioneerUser')) showApp();

        function showLogin() {
            document.getElementById('signupPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function showSignup() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('signupPage').classList.remove('hidden');
        }

        function quickSignup() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPass').value;

            if(!firstName || !lastName || !email || !pass) {
                alert('Please fill all fields!');
                return;
            }

            localStorage.setItem('pioneerUser', firstName + ' ' + lastName);
            localStorage.setItem('pioneerEmail', email);
            localStorage.setItem('pioneerPass', pass);
            localStorage.setItem('pioneerVerified', 'true');
            
            alert('✅ Account Created!\n\nWelcome to Pioneer, ' + firstName + '!\n\nYou are now verified! ⚡');
            showApp();
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            if(!localStorage.getItem('pioneerUser')) {
                alert('No account found! Click "Create new account"');
                return;
            }
            
            if(email === localStorage.getItem('pioneerEmail') || email === localStorage.getItem('pioneerUser')) {
                if(pass === localStorage.getItem('pioneerPass')) {
                    showApp();
                } else {
                    alert('Wrong password!');
                }
            } else {
                alert('Account not found! Sign up first.');
            }
        }

        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('signupPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userDisplay').textContent = localStorage.getItem('pioneerUser') + ' ✅';
            document.getElementById('welcomeName').textContent = localStorage.getItem('pioneerUser');
        }

        function showForgot() {
            alert('Forgot Password\n\nPioneer 9.0 will send reset link!\n\nFor now: Remember your password 😅');
        }

        function showLanguages() {
            const langs = ['English (US)', 'English (UK)', 'Yoruba', 'Hausa', 'Igbo', 'French', 'Arabic', 'Spanish'];
            alert('Select Language:\n\n' + langs.join('\n') + '\n\nPioneer 9.0 will support all languages!\n\nCurrent: English (US)');
        }
    </script>
</body>
                </html>
